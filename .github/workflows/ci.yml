name: Website smoke checks

on:
  push:
    branches:
      - main
      - 'rebuild/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate inline JavaScript and core feature markers
        run: node scripts/smoke-test.mjs
